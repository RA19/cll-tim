<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-labelledby="title desc">
  <title id="title">CLL-TIM: predicting infection and CLL treatment</title>
  <desc id="desc">CLL-TIM combines baseline CLL markers, routine laboratory results and infection histories in 28 machine-learning models. For each patient, CLL-TIM predicts the two-year risk of infection and/or CLL treatment and provides predictive confidence and personalized risk factors.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8aa4ae"/></marker>
  </defs>
  <rect width="1280" height="610" rx="22" fill="#f1f6f8"/>
  <rect x="32" y="30" width="8" height="65" rx="4" fill="#147d85"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="58" y="58" font-size="18" font-weight="700" letter-spacing="2" fill="#147d85">CLL-TIM</text>
    <text x="58" y="96" font-size="32" font-weight="700" fill="#142e46">Predicting infection and CLL treatment</text>
    <text x="58" y="135" font-size="19" fill="#4e6575">Patient-specific risk, predictive confidence and personalized risk factors</text>
    <rect x="42" y="174" width="363" height="340" rx="16" fill="#fff" stroke="#d7e3e8"/>
    <rect x="459" y="174" width="363" height="340" rx="16" fill="#142e46"/>
    <rect x="876" y="174" width="363" height="340" rx="16" fill="#fff" stroke="#d7e3e8"/>
    <path d="M416 344H446" stroke="#8aa4ae" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M833 344H863" stroke="#8aa4ae" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="69" y="214" font-size="12" letter-spacing="2" fill="#147d85" font-weight="700">01 / CLINICAL INPUTS</text>
    <text x="69" y="257" font-size="23" fill="#142e46" font-weight="700">Patient history and markers</text>
    <g font-size="18" fill="#4e6575">
      <circle cx="77" cy="311" r="5" fill="#147d85"/><text x="95" y="317">Baseline CLL markers</text>
      <circle cx="77" cy="359" r="5" fill="#147d85"/><text x="95" y="365">Routine laboratory results</text>
      <circle cx="77" cy="407" r="5" fill="#147d85"/><text x="95" y="413">Previous infections</text>
    </g>
    <text x="486" y="214" font-size="12" letter-spacing="2" fill="#8cd0cf" font-weight="700">02 / CLL-TIM</text>
    <text x="486" y="286" font-size="64" fill="#fff" font-weight="700">28</text>
    <text x="585" y="285" font-size="23" fill="#fff">models</text>
    <text x="486" y="334" font-size="19" fill="#fff">84 variables · 228 features</text>
    <text x="486" y="377" font-size="18" fill="#c8d9e5">Combining multiple perspectives</text>
    <text x="486" y="404" font-size="18" fill="#c8d9e5">on each patient's history.</text>
    <rect x="486" y="445" width="232" height="31" rx="15" fill="#26485f"/>
    <text x="501" y="466" font-size="13" fill="#d3e9ef">Up to seven years of patient history</text>
    <text x="903" y="214" font-size="12" letter-spacing="2" fill="#147d85" font-weight="700">03 / CLINICAL PREDICTIONS</text>
    <text x="903" y="257" font-size="22" fill="#142e46" font-weight="700">Infection and treatment risk</text>
    <g fill="#4e6575">
      <rect x="903" y="292" width="6" height="42" rx="3" fill="#147d85"/>
      <text x="924" y="309" font-size="18">Two-year risk of infection</text>
      <text x="924" y="332" font-size="18">and/or CLL treatment</text>
      <rect x="903" y="357" width="6" height="42" rx="3" fill="#d98b52"/>
      <text x="924" y="374" font-size="18">Predictive confidence</text>
      <text x="924" y="397" font-size="15">Certainty of this patient's prediction</text>
      <rect x="903" y="422" width="6" height="42" rx="3" fill="#8395b1"/>
      <text x="924" y="439" font-size="18">Personalized risk factors</text>
      <text x="924" y="462" font-size="15">Factors driving higher or lower risk</text>
    </g>
    <text x="43" y="553" font-size="14" fill="#627889">Two-year composite outcome: infection and/or initiation of CLL treatment, from the prediction point.</text>
    <text x="43" y="580" font-size="14" fill="#627889">Predictive confidence and personalized risk factors accompany each patient's prediction.</text>
  </g>
</svg>
