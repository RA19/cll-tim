name: clltim_calc_env
channels:
  - defaults
dependencies:
  - python=3.7.9
  # numeric stack (exact pins)
  - numpy=1.16.4
  - scipy=1.3.1
  - pandas=0.25.0
  - scikit-learn=0.21.2
  - xgboost=0.82
  # MKL stack (underscored names)
  - mkl=2019.4
  - mkl_fft=1.0.14
  - mkl_random=1.0.2
  - mkl-service=2.0.2
  # plotting you import (doesn't change math)
  - matplotlib=3.1.0
  - seaborn=0.9.0
  # tooling
  - pip=19.2.2
  - setuptools=41.0.1
  - wheel=0.33.4
  # pip-only pins
  - pip:
      - PyPDF2==1.26.0
      - shap==0.28.5
